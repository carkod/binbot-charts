name: Publish Package
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Check published version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 20 "https://registry.npmjs.org/binbot-charts/$version")
          case "$status" in
            200) echo "should_publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "should_publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "npm registry returned HTTP $status" >&2; exit 1 ;;
          esac
      - run: npm ci
        if: steps.version.outputs.should_publish == 'true'
      - run: npm run lint
        if: steps.version.outputs.should_publish == 'true'
      - run: npm test
        if: steps.version.outputs.should_publish == 'true'
      - run: npm publish
        if: steps.version.outputs.should_publish == 'true'

  create-release:
    needs: publish
    if: needs.publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.publish.outputs.version }}
          name: Release v${{ needs.publish.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
